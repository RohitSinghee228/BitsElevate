version: '3.8'

services:
  edupulse-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edupulse-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/edupulse
      - JWT_SECRET=your_jwt_secret
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - MAILGUN_API_KEY=${MAILGUN_API_KEY}
      - MAILGUN_DOMAIN=${MAILGUN_DOMAIN}
      - MAILGUN_ENABLED=false
    depends_on:
      - mongodb
    networks:
      - edupulse-network

  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - edupulse-network

networks:
  edupulse-network:
    driver: bridge

volumes:
  mongodb-data: 